# Пример конфигурации nginx для Nextera CRM.
#
# Самое важное здесь — страница техработ отдаётся статикой, без участия Node:
#   1) пока существует файл-флаг .maintenance (его ставит ./scripts/maintenance.sh
#      и деплой-скрипт) — сразу 503 с заглушкой;
#   2) если приложение всё же не отвечает (перезапуск, падение, пересборка .next)
#      — та же заглушка отдаётся по error_page 502/503/504.
#
# Замените APP_ROOT и server_name на свои и положите файл в
# /etc/nginx/sites-available/, затем: nginx -t && systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name crm.example.com;

    # Корень проекта на сервере (там, где лежат package.json и public/).
    set $app_root /var/www/nextera-crm;

    client_max_body_size 25m;

    # --- Режим технических работ -------------------------------------------
    # Пока лежит файл-флаг, наверх вообще ничего не пропускаем.
    if (-f /var/www/nextera-crm/.maintenance) {
        return 503;
    }

    error_page 502 503 504 /__maintenance.html;

    location = /__maintenance.html {
        internal;
        root /var/www/nextera-crm/public;
        try_files /maintenance.html =503;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Retry-After 120 always;
    }
    # -----------------------------------------------------------------------

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Во время пересборки .next приложение может отвечать ошибкой —
        # пусть вместо неё пользователь видит заглушку.
        proxy_intercept_errors on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Загруженные файлы отдаём напрямую, минуя Node.
    location /uploads/ {
        alias /var/www/nextera-crm/public/uploads/;
        access_log off;
        expires 30d;
    }
}
