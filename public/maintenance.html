<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Технические работы — Nextera CRM</title>
    <style>
      :root {
        --surface-app: #f8fafc;
        --surface-card: #ffffff;
        --border-subtle: #e9edf3;
        --text-primary: #0f172a;
        --text-secondary: #64748b;
        --primary-50: #eef2ff;
        --primary-500: #6366f1;
        --primary-600: #4f46e5;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 16px;
        background: var(--surface-app);
        color: var(--text-primary);
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: var(--surface-card);
        border: 1px solid var(--border-subtle);
        border-radius: 12px;
        box-shadow: 0 1px 3px 0 rgb(15 23 42 / 0.06), 0 1px 2px -1px rgb(15 23 42 / 0.04);
        padding: 32px 28px;
        text-align: center;
      }
      .icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 9999px;
        background: var(--primary-50);
        color: var(--primary-600);
      }
      .icon svg { animation: spin 3s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .icon svg { animation: none; }
      }
      h1 {
        margin: 0 0 10px;
        font-size: 20px;
        line-height: 1.3;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        font-size: 14px;
        line-height: 1.6;
        color: var(--text-secondary);
      }
      .hint {
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid var(--border-subtle);
        font-size: 13px;
        color: var(--text-secondary);
      }
      .brand {
        margin-top: 24px;
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-6.219-8.56" />
        </svg>
      </div>
      <h1>Ведутся технические работы</h1>
      <p>
        Обновляем CRM до новой версии. Это занимает несколько минут — данные в
        безопасности, ничего делать не нужно.
      </p>
      <p class="hint">Страница обновится автоматически, как только сайт снова заработает.</p>
      <p class="brand">Nextera CRM</p>
    </main>
    <script>
      // Тихо опрашиваем сайт и перезагружаем страницу, когда он снова отвечает.
      (function () {
        var DELAY = 15000;
        function check() {
          fetch(window.location.href, {
            method: "HEAD",
            cache: "no-store",
            headers: { "x-maintenance-probe": "1" },
          })
            .then(function (res) {
              if (res.status !== 503) {
                window.location.reload();
                return;
              }
              window.setTimeout(check, DELAY);
            })
            .catch(function () {
              window.setTimeout(check, DELAY);
            });
        }
        window.setTimeout(check, DELAY);
      })();
    </script>
  </body>
</html>
